<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Cost of Getting Big</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      margin: 40px;
    }

    h1 {
      font-size: 50px;
    }

    h2 {
      margin-top: 60px;
    }

    .chart {
      margin-top: 20px;
      margin-bottom: 50px;
    }
  </style>
</head>

<body>

  <h1>The Cost of Getting Big</h1>

  <p>
    Exploring protein, calories, and food affordability in Australia.
  </p>

  <h2>Cheapest Protein Sources</h2>
  <div id="chart1" class="chart"></div>

  <script>
const chart1 = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

  "data": {
    "url": "data/protein_foods.csv"
  },

  "transform": [
    {
      "calculate": "datum.price_aud / datum.protein_g",
      "as": "cost_per_protein"
    }
  ],

  "mark": "bar",

  "encoding": {
    "x": {
      "field": "food",
      "type": "nominal",
      "sort": "-y"
    },

    "y": {
      "field": "cost_per_protein",
      "type": "quantitative",
      "title": "AUD per gram of protein"
    },

    "color": {
      "field": "category",
      "type": "nominal"
    },

    "tooltip": [
      {"field": "food"},
      {"field": "price_aud"},
      {"field": "protein_g"},
      {"field": "cost_per_protein", "title": "AUD per g protein"}
    ]
  },

  "width": 700,
  "height": 400
};

    vegaEmbed('#chart1', chart1);
  </script>

</body>
</html>

<h2>Protein vs Calories</h2>
<div id="chart2" class="chart"></div>

<h2>Calorie Distribution</h2>
<div id="chart3" class="chart"></div>

<script>
  // CHART 2 - Scatter plot
  const chart2 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

    "data": {
      "url": "data/protein_foods.csv"
    },

    "mark": "circle",

    "encoding": {
      "x": {
        "field": "calories",
        "type": "quantitative"
      },
      "y": {
        "field": "protein_g",
        "type": "quantitative"
      },
      "color": {
        "field": "category",
        "type": "nominal"
      },
      "tooltip": [
        {"field": "food"},
        {"field": "protein_g"},
        {"field": "calories"}
      ]
    },

    "width": 700,
    "height": 400
  };

  vegaEmbed('#chart2', chart2);


// CHART 3 - Price vs Protein (with calorie size)
const chart3 = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

  "data": {
    "url": "data/protein_foods.csv"
  },

  "mark": "circle",

  "encoding": {
    "x": {
      "field": "price_aud",
      "type": "quantitative",
      "title": "Price (AUD)"
    },

    "y": {
      "field": "protein_g",
      "type": "quantitative",
      "title": "Protein (g)"
    },

    "size": {
      "field": "calories",
      "type": "quantitative",
      "title": "Calories"
    },

    "color": {
      "field": "category",
      "type": "nominal"
    },

    "tooltip": [
      {"field": "food"},
      {"field": "price_aud"},
      {"field": "protein_g"},
      {"field": "calories"},
      {"field": "category"}
    ]
  },

  "width": 700,
  "height": 400
};

vegaEmbed('#chart3', chart3);
</script>
